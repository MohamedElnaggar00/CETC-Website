<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CETC Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #C41230; --sidebar: #0a0a0a; --bg: #f4f4f4; --surface: #ffffff; --text: #111111; --text-light: #555555; }
        body { font-family: 'Cairo', sans-serif; margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }
        .app-layout { display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 280px; background: var(--sidebar); display: flex; flex-direction: column; z-index: 100; box-shadow: 4px 0 15px rgba(0,0,0,0.15); }
        .sidebar-header { padding: 25px; text-align: center; border-bottom: 1px solid #222; background: #000; }
        .logo-box { background: #ffffff; padding: 12px 15px; border-radius: 12px; display: inline-block; }
        .logo-box img { max-height: 45px; display: block; }
        .menu-list { flex-grow: 1; padding: 20px 0; overflow-y: auto; }
        .menu-item { padding: 15px 25px; display: flex; align-items: center; gap: 15px; color: #a0a0a0; font-weight: 700; cursor: pointer; transition: 0.3s; margin: 5px 15px; border-radius: 8px; }
        .menu-item:hover, .menu-item.active { background: var(--primary); color: white; }
        .user-section { padding: 20px; background: #000; text-align: center; border-top: 1px solid #222; }
        .main-content { flex: 1; overflow-y: auto; padding: 30px; background: var(--bg); }
        .module { display: none; animation: fadeIn 0.4s ease; }
        .module.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .tab-group { display: flex; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
        .tab-btn { padding: 10px 20px; border: 2px solid #ddd; background: var(--surface); color: var(--text-light); font-weight: 800; border-radius: 8px; cursor: pointer; transition: 0.3s; font-family: inherit; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }
        .control-item { background: var(--surface); border: 2px solid #ddd; border-radius: 8px; padding: 12px 20px; font-family: inherit; font-weight: 700; outline: none; }
        .table-wrapper { background: var(--surface); border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); overflow-x: auto; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: #111; color: #fff; padding: 18px 15px; font-weight: 800; border-bottom: 3px solid var(--primary); }
        td { padding: 15px; border-bottom: 1px solid #ddd; text-align: center; color: #000; font-weight: 700; }
        .val-positive { color: #10b981 !important; }
        .val-negative { color: #ef4444 !important; }
        .excel-table-wrapper { background: #ffffff; border: 1px solid #b0b0b0; overflow-x: auto; border-radius: 6px; }
        .excel-table { width: 100%; border-collapse: collapse; font-family: Calibri, sans-serif; font-size: 13.5px; }
        .excel-table th { background: #f3f3f3; border: 1px solid #b0b0b0; padding: 8px; }
        .excel-table td { border: 1px solid #d4d4d4; padding: 6px; text-align: center; }
        @media (max-width: 768px) { .app-layout { flex-direction: column; overflow-y: auto; } .sidebar { width: 100%; } .user-section { display: none; } .main-content { padding: 15px; } }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-box"><img src="https://hmfuxiafusrbxvxzfaef.supabase.co/storage/v1/object/public/assets/logo.png" alt="Logo"></div>
                <div style="font-weight: 900; color: white; margin-top:10px;">CETC DASHBOARD</div>
            </div>
            <nav class="menu-list">
                <div class="menu-item active" onclick="switchMod('billing', this)"><i class="fas fa-file-invoice-dollar"></i><span>حصر الفواتير</span></div>
                <div class="menu-item" onclick="switchMod('monthly', this)"><i class="fas fa-calendar-alt"></i><span>الايرادات الشهرية</span></div>
                <div class="menu-item" onclick="switchMod('reports', this)"><i class="fas fa-list-ol"></i><span>مسلسلات التقارير</span></div>
                <a href="/logout" class="menu-item" style="color: #ff4444;"><i class="fas fa-sign-out-alt"></i><span>خروج</span></a>
            </nav>
            <div class="user-section"><div style="color: white; font-weight: 800;">مسؤول النظام</div></div>
        </aside>

        <main class="main-content">
            <section id="billing-module" class="module active">
                <h2 style="border-bottom: 4px solid var(--primary); padding-bottom:10px; display:inline-block; font-weight: 900;">حصر فواتير الشركات</h2>
                <div class="tab-group">
                    <button class="tab-btn" onclick="loadData(1, this)">سجل - 01 LOG</button>
                    <button class="tab-btn" onclick="loadData(2, this)">الحي التاسع</button>
                    <button class="tab-btn" onclick="loadData(3, this)">ترعة الحمام</button>
                    <button class="tab-btn" onclick="loadData(4, this)">مشروع ديارنا</button>
                </div>
                <div class="table-wrapper">
                    <table><thead><tr id="h-billing"></tr></thead><tbody id="b-billing"><tr><td colspan="10" style="padding:40px;">اختر المشروع...</td></tr></tbody></table>
                </div>
            </section>

            <section id="monthly-module" class="module">
                <h2 style="border-bottom: 4px solid var(--primary); padding-bottom:10px; display:inline-block; font-weight: 900;">الايرادات الشهرية</h2>
                <div class="tab-group">
                    <button class="tab-btn" onclick="loadIncomeData('2024', this)">إيرادات 2024</button>
                    <button class="tab-btn" onclick="loadIncomeData('2025', this)">إيرادات 2025</button>
                    <button class="tab-btn" onclick="loadIncomeData('2026', this)">إيرادات 2026</button>
                </div>
                <div class="table-wrapper" style="margin-bottom: 25px;">
                    <table><thead id="h-monthly"></thead><tbody id="b-monthly"><tr><td colspan="3" style="padding:40px;">اختر السنة...</td></tr></tbody></table>
                </div>
                <div style="background: white; padding: 20px; border-radius: 12px; border: 1px solid #ddd;">
                    <canvas id="incomeChart" height="100"></canvas>
                </div>
            </section>

            <section id="reports-module" class="module">
                <h2 style="border-bottom: 4px solid var(--primary); padding-bottom:10px; display:inline-block; font-weight: 900;">مسلسلات التقارير</h2>
                <div style="display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap;">
                    <select id="report-sheet-select" class="control-item" onchange="loadReportData(this.value)" style="flex: 1;"><option value="">تحميل التقارير...</option></select>
                    <input type="text" id="report-search-input" class="control-item" placeholder="بحث..." onkeyup="filterReportTable()" style="flex: 1.5;">
                </div>
                <div class="excel-table-wrapper"><table class="excel-table"><thead id="h-reports"></thead><tbody id="b-reports"></tbody></table></div>
            </section>
        </main>
    </div>

    <script>
        let incomeChartInstance = null;
        let rawReportData = [];
        let currentReportMaxCols = 0;

        function switchMod(name, btn) {
            document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
            if(btn) btn.classList.add('active');
            document.querySelectorAll('.module').forEach(s => s.classList.remove('active'));
            document.getElementById(name + '-module').classList.add('active');
            if (name === 'reports') loadReportSheets();
        }

        async function loadData(id, btn) {
            document.querySelectorAll('#billing-module .tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const h = document.getElementById('h-billing'), b = document.getElementById('b-billing');
            b.innerHTML = '<tr><td colspan="10" class="loading"><i class="fas fa-circle-notch fa-spin"></i> جاري مزامنة البيانات من درايف...</td></tr>';
            
            try {
                const res = await fetch(`/get-data/${id}`);
                const data = await res.json();
                
                h.innerHTML = ''; b.innerHTML = '';
                
                if (data.error) {
                    b.innerHTML = `<tr><td colspan="10" style="color:red; padding:40px; text-align:center; font-weight:bold;">حدث خطأ في جلب البيانات: <br>${data.error}</td></tr>`;
                    return;
                }

                if(data.length > 2) {
                    const headers = data[2];
                    
                    // رسم رؤوس الجدول
                    headers.forEach(t => { const th = document.createElement('th'); th.textContent = t || '-'; h.appendChild(th); });
                    
                    // البحث عن مؤشر عمود مبلغ الفاتورة بالاسم ديناميكياً لتلوينه بشكل معزول
                    let invoiceColIdx = -1;
                    headers.forEach((t, idx) => {
                        if (t && (t.includes('فاتورة') || t.includes('الفاتورة'))) {
                            invoiceColIdx = idx;
                        }
                    });

                    data.slice(3).forEach(row => {
                        if(!row[0]) return;
                        const tr = document.createElement('tr');
                        row.forEach((c, idx) => { 
                            const td = document.createElement('td'); 
                            td.textContent = c || '-'; 
                            
                            // نلون فقط خلايا عمود مبلغ الفاتورة، وتظل الأعمدة الأخرى باللون الأسود الافتراضي
                            if(idx === invoiceColIdx && c && !isNaN(parseFloat(String(c).replace(/,/g, '')))) {
                                const val = parseFloat(String(c).replace(/,/g, ''));
                                if(val > 0) td.classList.add('val-positive');
                                else if(val < 0) td.classList.add('val-negative');
                            }
                            tr.appendChild(td); 
                        });
                        b.appendChild(tr);
                    });
                } else {
                    b.innerHTML = '<tr><td colspan="10" style="padding:40px; text-align:center;">لا توجد بيانات مسجلة في هذا الملف.</td></tr>';
                }
            } catch (err) {
                b.innerHTML = `<tr><td colspan="10" style="color:red; padding:40px; text-align:center; font-weight:bold;">فشل الاتصال بالخادم: <br>${err.message}</td></tr>`;
            }
        }

        async function loadIncomeData(year, btn) {
            document.querySelectorAll('#monthly-module .tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const h = document.getElementById('h-monthly'), b = document.getElementById('b-monthly');
            b.innerHTML = '<tr><td colspan="3" class="loading"><i class="fas fa-circle-notch fa-spin"></i> جاري مزامنة البيانات...</td></tr>';
            
            try {
                const res = await fetch(`/get-data/${year}`);
                const data = await res.json();
                
                h.innerHTML = ''; b.innerHTML = '';
                
                if (data.error) {
                    b.innerHTML = `<tr><td colspan="3" style="color:red; padding:40px; text-align:center; font-weight:bold;">حدث خطأ في جلب البيانات: <br>${data.error}</td></tr>`;
                    return;
                }

                if(data.length > 1) {
                    const trH = document.createElement('tr');
                    data[0].slice(0,3).forEach(t => { const th = document.createElement('th'); th.textContent = t; trH.appendChild(th); });
                    h.appendChild(trH);
                    const labels = [], values = [];
                    data.slice(1).forEach(row => {
                        if(!row[0] || String(row[0]).toLowerCase().includes('total')) return;
                        const tr = document.createElement('tr');
                        row.slice(0,3).forEach((c, i) => { const td = document.createElement('td'); td.textContent = c || '-'; tr.appendChild(td); });
                        b.appendChild(tr);
                        labels.push(row[1]); 
                        values.push(parseFloat(String(row[2]).replace(/,/g, '')) || 0);
                    });
                    drawIncomeChart(year, labels, values);
                } else {
                    b.innerHTML = '<tr><td colspan="3" style="padding:40px; text-align:center;">لا توجد بيانات مسجلة.</td></tr>';
                }
            } catch (err) {
                b.innerHTML = `<tr><td colspan="3" style="color:red; padding:40px; text-align:center; font-weight:bold;">فشل الاتصال بالخادم: <br>${err.message}</td></tr>`;
            }
        }

        function drawIncomeChart(year, labels, data) {
            const ctx = document.getElementById('incomeChart').getContext('2d');
            if (incomeChartInstance) incomeChartInstance.destroy();
            incomeChartInstance = new Chart(ctx, {
                type: 'bar', 
                data: {
                    labels: labels,
                    datasets: [{
                        label: `إيرادات ${year}`,
                        data: data,
                        backgroundColor: 'rgba(196, 18, 48, 0.8)',
                        borderColor: '#C41230',
                        borderWidth: 1
                    }]
                },
                options: { 
                    responsive: true, 
                    scales: { y: { beginAtZero: true }, x: { ticks: { font: { family: 'Cairo', weight: 'bold' } } } },
                    plugins: { legend: { labels: { font: { family: 'Cairo' } } } }
                }
            });
        }

        async function loadReportSheets() {
            const select = document.getElementById('report-sheet-select');
            if (select.options.length > 1) return;
            try {
                const res = await fetch('/get-report-sheets');
                const data = await res.json();
                
                if (data.error) {
                    select.innerHTML = `<option value="">خطأ: ${data.error}</option>`;
                    return;
                }
                
                select.innerHTML = '<option value="">اختر التقرير...</option>';
                data.sheets.forEach(s => { const opt = document.createElement('option'); opt.value = s; opt.textContent = s; select.appendChild(opt); });
            } catch (err) {
                select.innerHTML = '<option value="">فشل الاتصال بالخادم</option>';
            }
        }

        async function loadReportData(s) {
            const h = document.getElementById('h-reports'), b = document.getElementById('b-reports');
            if(!s) return;
            b.innerHTML = '<tr><td colspan="10" class="loading"><i class="fas fa-circle-notch fa-spin"></i> جاري مزامنة بيانات التقرير...</td></tr>';
            
            try {
                const res = await fetch(`/get-report-data?sheet=${encodeURIComponent(s)}`);
                const data = await res.json();
                
                if (data.error) {
                    b.innerHTML = `<tr><td colspan="10" style="color:red; padding:40px; text-align:center; font-weight:bold;">حدث خطأ في جلب بيانات التقرير: <br>${data.error}</td></tr>`;
                    return;
                }
                
                rawReportData = data;
                currentReportMaxCols = Math.max(...data.map(r => r.length));
                renderReportTable(data);
            } catch (err) {
                b.innerHTML = `<tr><td colspan="10" style="color:red; padding:40px; text-align:center; font-weight:bold;">فشل الاتصال بالخادم: <br>${err.message}</td></tr>`;
            }
        }

        function renderReportTable(data) {
            const h = document.getElementById('h-reports'), b = document.getElementById('b-reports');
            h.innerHTML = ''; b.innerHTML = '';
            if(!data.length) return;
            const trH = document.createElement('tr');
            for(let i=0; i<currentReportMaxCols; i++) { const th = document.createElement('th'); th.textContent = data[0][i] || `عمود ${i+1}`; trH.appendChild(th); }
            h.appendChild(trH);
            data.slice(1).forEach(row => {
                const tr = document.createElement('tr');
                for(let i=0; i<currentReportMaxCols; i++) { const td = document.createElement('td'); td.textContent = row[i] || ''; tr.appendChild(td); }
                b.appendChild(tr);
            });
        }

        function filterReportTable() {
            const q = document.getElementById('report-search-input').value.toLowerCase();
            if(!q) return renderReportTable(rawReportData);
            const filtered = [rawReportData[0], ...rawReportData.slice(1).filter(r => r.some(c => String(c).toLowerCase().includes(q)))];
            renderReportTable(filtered);
        }
    </script>
</body>
</html>
