<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم CETC - E-JUST</title>
    <link rel="icon" type="image/png" href="https://hmfuxiafusrbxvxzfaef.supabase.co/storage/v1/object/public/assets/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #C41230; --sidebar: #0a0a0a; --bg: #f4f4f4; --surface: #ffffff; --text: #111111; --text-light: #555555; }
        
        /* ضبط الصورة الخلفية ممتدة وثابتة أسفل كامل لوحة التحكم */
        body { 
            font-family: 'Cairo', sans-serif; 
            margin: 0; 
            background: linear-gradient(rgba(15, 23, 42, 0.85), rgba(15, 23, 42, 0.92)), url('https://hmfuxiafusrbxvxzfaef.supabase.co/storage/v1/object/public/assets/background.jpg') no-repeat center/cover; 
            background-attachment: fixed;
            color: #ffffff; 
            height: 100vh;
            overflow: hidden; 
        }

        .app-layout { 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            background: transparent;
        }

        /* شريط جانبي زجاجي بلوري شفاف ومطور بفلتر بلوري عميق */
        .sidebar { 
            width: 280px; 
            background: rgba(15, 23, 42, 0.45); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            display: flex; 
            flex-direction: column; 
            z-index: 100; 
            box-shadow: 4px 0 30px rgba(0,0,0,0.2); 
            border-left: 1px solid rgba(255, 255, 255, 0.1); 
        }
        
        .sidebar-header { 
            padding: 25px; 
            text-align: center; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.08); 
            background: rgba(255, 255, 255, 0.03); 
        }
        
        .logo-box { 
            background: #ffffff; 
            padding: 12px 15px; 
            border-radius: 12px; 
            display: inline-block; 
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        .logo-box img { max-height: 45px; display: block; }
        
        .menu-list { flex-grow: 1; padding: 20px 0; overflow-y: auto; }
        
        .menu-item { 
            padding: 15px 25px; 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            color: #cbd5e1; 
            font-weight: 700; 
            cursor: pointer; 
            transition: 0.3s; 
            margin: 5px 15px; 
            border-radius: 8px; 
            text-decoration: none;
        }
        .menu-item:hover, .menu-item.active { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(196, 12, 48, 0.2); }
        
        .user-section { 
            padding: 20px; 
            background: rgba(255, 255, 255, 0.03); 
            text-align: center; 
            border-top: 1px solid rgba(255, 255, 255, 0.08); 
        }
        
        .main-content { flex: 1; overflow-y: auto; padding: 30px; background: transparent; scroll-behavior: smooth; }
        
        .module { display: none; animation: fadeIn 0.4s ease; }
        .module.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        /* ترويسة عناوين بيضاء مضيئة للأقسام */
        .module h2 {
            color: #ffffff !important;
            font-weight: 900;
        }

        .tab-group { display: flex; gap: 12px; margin-bottom: 25px; flex-wrap: wrap; }
        
        /* أزرار التبويب الزجاجية الفاتحة المتناسقة */
        .tab-btn { 
            padding: 10px 20px; 
            border: 1px solid rgba(255, 255, 255, 0.15); 
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: #e2e8f0; 
            font-weight: 800; 
            border-radius: 8px; 
            cursor: pointer; 
            transition: 0.3s; 
            font-family: inherit; 
        }
        .tab-btn:hover { 
            background: rgba(255, 255, 255, 0.25); 
            color: #ffffff; 
        }
        .tab-btn.active { 
            background: var(--primary); 
            color: white; 
            border-color: var(--primary); 
            box-shadow: 0 4px 15px rgba(196, 12, 48, 0.3);
        }
        
        /* عناصر تحكم وبحث بلورية زجاجية */
        .control-item { 
            background: rgba(255, 255, 255, 0.15) !important; 
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.2) !important; 
            border-radius: 8px; 
            padding: 12px 20px; 
            font-family: inherit; 
            font-weight: 700; 
            outline: none; 
            color: white !important;
            transition: 0.3s;
        }
        .control-item::placeholder {
            color: #94a3b8;
        }
        .control-item:focus {
            border-color: var(--primary) !important;
            background: rgba(255, 255, 255, 0.25) !important;
            box-shadow: 0 0 15px rgba(196, 12, 48, 0.2);
        }
        select.control-item option {
            background: #111111;
            color: #ffffff;
        }

        /* حاويات الجداول الزجاجية ناصعة التباين لسهولة قراءة الأرقام الحسابية الصعبة */
        .table-wrapper { 
            background: rgba(255, 255, 255, 0.88); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 12px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.25); 
            overflow-x: auto; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
        }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: #111111; color: #ffffff; padding: 18px 15px; font-weight: 800; border-bottom: 3px solid var(--primary); }
        td { padding: 15px; border-bottom: 1px solid #ddd; text-align: center; color: #111111; font-weight: 700; }
        
        tr:nth-child(even) { background: rgba(0, 0, 0, 0.02); }
        tr:hover { background: rgba(196, 12, 48, 0.03); }

        .val-positive { color: #10b981 !important; }
        .val-negative { color: #ef4444 !important; }

        /* تنسيق مخصص لصف الإجمالي ليظهر بارزاً وأنيقاً في الجدول */
        tr.total-row td {
            background: rgba(196, 12, 48, 0.1) !important;
            color: var(--primary) !important;
            font-weight: 900 !important;
            font-size: 1.1rem;
            border-top: 2px solid var(--primary);
        }
        
        /* جدول تقارير الإكسيل الزجاجي ناصع التباين */
        .excel-table-wrapper { 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2); 
            overflow-x: auto; 
            border-radius: 8px; 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
        }
        .excel-table { width: 100%; border-collapse: collapse; font-family: Calibri, sans-serif; font-size: 13.5px; }
        .excel-table th { background: #1a1a1a; color: white; border: 1px solid #333; padding: 10px; }
        .excel-table td { border: 1px solid #d4d4d4; padding: 8px; text-align: center; color: #111111; font-weight: 700; }
        
        /* حاوية الرسم البياني الزجاجية المخصصة */
        .chart-container {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 25px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        @media (max-width: 768px) { 
            .app-layout { flex-direction: column; overflow-y: auto; } 
            .sidebar { width: 100%; border-left: none; border-bottom: 1px solid rgba(255,255,255,0.08); } 
            .user-section { display: none; } 
            .main-content { padding: 15px; } 
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-box"><img src="https://hmfuxiafusrbxvxzfaef.supabase.co/storage/v1/object/public/assets/logo.png" alt="Logo"></div>
                <div style="font-weight: 900; color: white; margin-top:10px;">CETC DASHBOARD</div>
            </div>
            <nav class="menu-list">
                <div class="menu-item active" onclick="switchMod('billing', this)"><i class="fas fa-file-invoice-dollar"></i><span>حصر الفواتير</span></div>
                <div class="menu-item" onclick="switchMod('monthly', this)"><i class="fas fa-calendar-alt"></i><span>الايرادات الشهرية</span></div>
                <div class="menu-item" onclick="switchMod('reports', this)"><i class="fas fa-list-ol"></i><span>مسلسلات التقارير</span></div>
                <a href="/logout" class="menu-item" style="color: #ff4444;"><i class="fas fa-sign-out-alt"></i><span>خروج</span></a>
            </nav>
            <div class="user-section"><div style="color: white; font-weight: 800;">مسؤول النظام</div></div>
        </aside>

        <main class="main-content" id="mainScrollContent">
            <section id="billing-module" class="module active">
                <h2 style="border-bottom: 4px solid var(--primary); padding-bottom:10px; display:inline-block; font-weight: 900;">حصر فواتير الشركات</h2>
                <div class="tab-group">
                    <button class="tab-btn" onclick="loadData(1, this)">سجل - 01 LOG</button>
                    <button class="tab-btn" onclick="loadData(2, this)">الحي التاسع</button>
                    <button class="tab-btn" onclick="loadData(3, this)">ترعة الحمام</button>
                    <button class="tab-btn" onclick="loadData(4, this)">مشروع ديارنا</button>
                </div>
                <div class="table-wrapper">
                    <table><thead><tr id="h-billing"></tr></thead><tbody id="b-billing"><tr><td colspan="10" style="padding:40px;">اختر المشروع...</td></tr></tbody></table>
                </div>
            </section>

            <section id="monthly-module" class="module">
                <h2 style="border-bottom: 4px solid var(--primary); padding-bottom:10px; display:inline-block; font-weight: 900;">الايرادات الشهرية</h2>
                <div class="tab-group">
                    <button class="tab-btn" onclick="loadIncomeData('2022', this)">إيرادات 2022</button>
                    <button class="tab-btn" onclick="loadIncomeData('2023', this)">إيرادات 2023</button>
                    <button class="tab-btn" onclick="loadIncomeData('2024', this)">إيرادات 2024</button>
                    <button class="tab-btn" onclick="loadIncomeData('2025', this)">إيرادات 2025</button>
                    <button class="tab-btn" onclick="loadIncomeData('2026', this)">إيرادات 2026</button>
                    <!-- الزر الجديد لعرض الإجمالي الشامل -->
                    <button class="tab-btn" style="background: rgba(196, 12, 48, 0.4); border-color: rgba(196, 12, 48, 0.6);" onclick="loadAllYearsIncome(this)">إجمالي إيرادات المركز</button>
                </div>
                <div class="table-wrapper" style="margin-bottom: 25px;">
                    <table><thead id="h-monthly"></thead><tbody id="b-monthly"><tr><td colspan="3" style="padding:40px;">اختر السنة...</td></tr></tbody></table>
                </div>
                <!-- حاوية الرسم البياني الزجاجية المحدثة -->
                <div class="chart-container">
                    <canvas id="incomeChart" height="100"></canvas>
                </div>
            </section>

            <section id="reports-module" class="module">
                <h2 style="border-bottom: 4px solid var(--primary); padding-bottom:10px; display:inline-block; font-weight: 900;">مسلسلات التقارير</h2>
                <div style="display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap;">
                    <select id="report-sheet-select" class="control-item" onchange="loadReportData(this.value)" style="flex: 1;"><option value="">تحميل التقارير...</option></select>
                    <input type="text" id="report-search-input" class="control-item" placeholder="بحث..." onkeyup="filterReportTable()" style="flex: 1.5;">
                </div>
                <div class="excel-table-wrapper"><table class="excel-table"><thead id="h-reports"></thead><tbody id="b-reports"></tbody></table></div>
            </section>
        </main>
    </div>

    <script>
        let incomeChartInstance = null;
        let rawReportData = [];
        let currentReportMaxCols = 0;

        // قاموس ترجمة أسماء التقارير للعربية
        const reportNamesMap = {
            "CONS.GEO.FD": "ساندكون",
            "Geo.Soil": "تربة",
            "CONS.GEO.PLT": "تحميل تربة",
            "CONS.CONC": "مكعبات خرسانية",
            "CONS.Grout": "مكعبات جراوت",
            "Conc Core": "قلب خرساني",
            "CONS.Interlock": "انترلوك",
            "GEO.ROCK": "صخور",
            "CONS.Curbs": "بردورات",
            "CONS.BRIKS": "طوب بناء",
            ".Conc.ST.MAT": "مواد خلطات",
            "Cons.CEM": "أسمنت",
            "MIXS": "خلطات خرسانية",
            "CONS.Mortat": "مكعبات مونة",
            "CAL": "معايرة",
            "Asphalt": "خلطات اسفلتية",
            "Asphalt Core": "كور أسفلت"
        };

        function switchMod(name, btn) {
            document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
            if(btn) btn.classList.add('active');
            document.querySelectorAll('.module').forEach(s => s.classList.remove('active'));
            document.getElementById(name + '-module').classList.add('active');
            
            // إعادة التمرير للأعلى عند التبديل بين الأقسام
            const mainContent = document.getElementById('mainScrollContent');
            if(mainContent) mainContent.scrollTo({ top: 0, behavior: 'smooth' });

            if (name === 'reports') loadReportSheets();
        }

        async function loadData(id, btn) {
            document.querySelectorAll('#billing-module .tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const h = document.getElementById('h-billing'), b = document.getElementById('b-billing');
            b.innerHTML = '<tr><td colspan="10" class="loading"><i class="fas fa-circle-notch fa-spin"></i> جاري مزامنة البيانات من درايف...</td></tr>';
            
            try {
                const res = await fetch(`/get-data/${id}`);
                const data = await res.json();
                
                h.innerHTML = ''; b.innerHTML = '';
                
                if (data.error) {
                    b.innerHTML = `<tr><td colspan="10" style="color:red; padding:40px; text-align:center; font-weight:bold;">حدث خطأ في جلب البيانات: <br>${data.error}</td></tr>`;
                    return;
                }

                if(data.length > 2) {
                    const headers = data[2];
                    
                    headers.forEach(t => { const th = document.createElement('th'); th.textContent = t || '-'; h.appendChild(th); });
                    
                    let invoiceColIdx = -1;
                    headers.forEach((t, idx) => {
                        if (t && (t.includes('فاتورة') || t.includes('الفاتورة'))) {
                            invoiceColIdx = idx;
                        }
                    });

                    data.slice(3).forEach(row => {
                        if(!row[0]) return;
                        const tr = document.createElement('tr');
                        row.forEach((c, idx) => { 
                            const td = document.createElement('td'); 
                            td.textContent = c || '-'; 
                            
                            if(idx === invoiceColIdx && c && !isNaN(parseFloat(String(c).replace(/,/g, '')))) {
                                const val = parseFloat(String(c).replace(/,/g, ''));
                                if(val > 0) td.classList.add('val-positive');
                                else if(val < 0) td.classList.add('val-negative');
                            }
                            tr.appendChild(td); 
                        });
                        b.appendChild(tr);
                    });
                } else {
                    b.innerHTML = '<tr><td colspan="10" style="padding:40px; text-align:center;">لا توجد بيانات مسجلة في هذا الملف.</td></tr>';
                }
            } catch (err) {
                b.innerHTML = `<tr><td colspan="10" style="color:red; padding:40px; text-align:center; font-weight:bold;">فشل الاتصال بالخادم: <br>${err.message}</td></tr>`;
            }
        }

        async function loadIncomeData(year, btn) {
            document.querySelectorAll('#monthly-module .tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const h = document.getElementById('h-monthly'), b = document.getElementById('b-monthly');
            b.innerHTML = '<tr><td colspan="3" class="loading"><i class="fas fa-circle-notch fa-spin"></i> جاري مزامنة البيانات...</td></tr>';
            
            try {
                const res = await fetch(`/get-data/${year}`);
                const data = await res.json();
                
                h.innerHTML = ''; b.innerHTML = '';
                
                if (data.error) {
                    b.innerHTML = `<tr><td colspan="3" style="color:red; padding:40px; text-align:center; font-weight:bold;">حدث خطأ في جلب البيانات: <br>${data.error}</td></tr>`;
                    return;
                }

                if(data.length > 1) {
                    const trH = document.createElement('tr');
                    data[0].slice(0,3).forEach(t => { const th = document.createElement('th'); th.textContent = t; trH.appendChild(th); });
                    h.appendChild(trH);
                    
                    const labels = [], values = [];
                    
                    data.slice(1).forEach(row => {
                        if(!row[0]) return; 
                        
                        const isTotalRow = String(row[0]).toLowerCase().includes('total') || String(row[0]).includes('إجمالي') || String(row[1]).includes('Total') || String(row[1]).includes('إجمالي');

                        const tr = document.createElement('tr');
                        
                        if(isTotalRow) {
                            tr.classList.add('total-row');
                        }

                        row.slice(0,3).forEach((c, i) => { 
                            const td = document.createElement('td'); 
                            td.textContent = c || '-'; 
                            tr.appendChild(td); 
                        });
                        b.appendChild(tr);
                        
                        if(!isTotalRow) {
                            labels.push(row[1]); 
                            values.push(parseFloat(String(row[2]).replace(/,/g, '')) || 0);
                        }
                    });
                    
                    drawIncomeChart(year, labels, values);
                } else {
                    b.innerHTML = '<tr><td colspan="3" style="padding:40px; text-align:center;">لا توجد بيانات مسجلة.</td></tr>';
                }
            } catch (err) {
                b.innerHTML = `<tr><td colspan="3" style="color:red; padding:40px; text-align:center; font-weight:bold;">فشل الاتصال بالخادم: <br>${err.message}</td></tr>`;
            }
        }

        // ================= الدالة الجديدة لجلب وعرض الإجمالي لجميع السنوات =================
        async function loadAllYearsIncome(btn) {
            document.querySelectorAll('#monthly-module .tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const h = document.getElementById('h-monthly'), b = document.getElementById('b-monthly');
            b.innerHTML = '<tr><td colspan="3" class="loading"><i class="fas fa-circle-notch fa-spin"></i> جاري مزامنة وحساب إيرادات جميع السنوات...</td></tr>';
            
            const years = ['2022', '2023', '2024', '2025', '2026'];
            let grandTotal = 0;
            const labels = [];
            const values = [];
            
            try {
                // استخدام Promise.all لجلب ملفات الإكسيل لجميع السنوات في نفس الوقت لسرعة الأداء
                const fetchPromises = years.map(year => fetch(`/get-data/${year}`).then(res => res.json()).catch(err => ({ error: err.message, year })));
                const results = await Promise.all(fetchPromises);
                
                h.innerHTML = '<tr><th>السنة (Year)</th><th colspan="2">إجمالي الإيرادات السنوية (ج.م)</th></tr>';
                b.innerHTML = '';

                results.forEach((data, index) => {
                    const currentYear = years[index];
                    let yearTotal = 0;
                    
                    if (data && !data.error && data.length > 1) {
                        // البحث عن صف الإجمالي واستخراج الرقم منه
                        data.slice(1).forEach(row => {
                            if (!row[0]) return;
                            const isTotalRow = String(row[0]).toLowerCase().includes('total') || String(row[0]).includes('إجمالي') || String(row[1]).includes('Total') || String(row[1]).includes('إجمالي');
                            if (isTotalRow) {
                                // استخراج الرقم من العمود الثالث (قيمة الإيراد)
                                yearTotal = parseFloat(String(row[2]).replace(/,/g, '')) || 0;
                            }
                        });
                    }
                    
                    // إضافة صف لكل سنة
                    const tr = document.createElement('tr');
                    tr.innerHTML = `<td>${currentYear}</td><td colspan="2" style="font-weight: 800; font-size: 1.05rem;">${yearTotal.toLocaleString()}</td>`;
                    b.appendChild(tr);
                    
                    grandTotal += yearTotal;
                    labels.push(currentYear);
                    values.push(yearTotal);
                });
                
                // إضافة صف الإجمالي الشامل لجميع السنوات في الأسفل بتنسيق مميز
                const finalTr = document.createElement('tr');
                finalTr.classList.add('total-row');
                finalTr.innerHTML = `<td>إجمالي إيرادات المركز</td><td colspan="2" style="font-size: 1.2rem;">${grandTotal.toLocaleString()} ج.م</td>`;
                b.appendChild(finalTr);
                
                // رسم التشارت ببيانات السنوات المجمعة
                drawIncomeChart('إجمالي الإيرادات السنوية', labels, values);
                
            } catch (error) {
                b.innerHTML = `<tr><td colspan="3" style="color:red; padding:40px; text-align:center; font-weight:bold;">حدث خطأ أثناء تجميع البيانات: <br>${error.message}</td></tr>`;
            }
        }

        function drawIncomeChart(titleOrYear, labels, data) {
            const ctx = document.getElementById('incomeChart').getContext('2d');
            if (incomeChartInstance) incomeChartInstance.destroy();
            
            // تحديد عنوان الرسم البياني بشكل ذكي (إما رقم السنة أو عنوان الإجمالي)
            const chartLabel = isNaN(titleOrYear) ? titleOrYear : `إيرادات ${titleOrYear}`;
            
            incomeChartInstance = new Chart(ctx, {
                type: 'bar', 
                data: {
                    labels: labels,
                    datasets: [{
                        label: chartLabel,
                        data: data,
                        backgroundColor: 'rgba(196, 18, 48, 0.8)',
                        borderColor: '#C41230',
                        borderWidth: 1
                    }]
                },
                options: { 
                    responsive: true, 
                    scales: { y: { beginAtZero: true }, x: { ticks: { font: { family: 'Cairo', weight: 'bold' } } } },
                    plugins: { legend: { labels: { font: { family: 'Cairo' } } } }
                }
            });
        }

        async function loadReportSheets() {
            const select = document.getElementById('report-sheet-select');
            if (select.options.length > 1) return;
            try {
                const res = await fetch('/get-report-sheets');
                const data = await res.json();
                
                if (data.error) {
                    select.innerHTML = `<option value="">خطأ: ${data.error}</option>`;
                    return;
                }
                
                select.innerHTML = '<option value="">اختر التقرير...</option>';
                
                // إضافة أسماء التقارير وتطبيق القاموس المترجم
                data.sheets.forEach(s => { 
                    const opt = document.createElement('option'); 
                    opt.value = s; 
                    
                    const cleanSheetName = s.trim();
                    const arabicName = reportNamesMap[cleanSheetName];
                    
                    if (arabicName) {
                        opt.textContent = `${arabicName} (${cleanSheetName})`;
                    } else {
                        opt.textContent = cleanSheetName; 
                    }
                    
                    select.appendChild(opt); 
                });
            } catch (err) {
                select.innerHTML = '<option value="">فشل الاتصال بالخادم</option>';
            }
        }

        async function loadReportData(s) {
            const h = document.getElementById('h-reports'), b = document.getElementById('b-reports');
            if(!s) return;
            b.innerHTML = '<tr><td colspan="10" class="loading"><i class="fas fa-circle-notch fa-spin"></i> جاري مزامنة بيانات التقرير...</td></tr>';
            
            try {
                const res = await fetch(`/get-report-data?sheet=${encodeURIComponent(s)}`);
                const data = await res.json();
                
                if (data.error) {
                    b.innerHTML = `<tr><td colspan="10" style="color:red; padding:40px; text-align:center; font-weight:bold;">حدث خطأ في جلب بيانات التقرير: <br>${data.error}</td></tr>`;
                    return;
                }
                
                rawReportData = data;
                currentReportMaxCols = Math.max(...data.map(r => r.length));
                renderReportTable(data);
            } catch (err) {
                b.innerHTML = `<tr><td colspan="10" style="color:red; padding:40px; text-align:center; font-weight:bold;">فشل الاتصال بالخادم: <br>${err.message}</td></tr>`;
            }
        }

        function renderReportTable(data) {
            const h = document.getElementById('h-reports'), b = document.getElementById('b-reports');
            h.innerHTML = ''; b.innerHTML = '';
            if(!data.length) return;
            const trH = document.createElement('tr');
            for(let i=0; i<currentReportMaxCols; i++) { const th = document.createElement('th'); th.textContent = data[0][i] || `عمود ${i+1}`; trH.appendChild(th); }
            h.appendChild(trH);
            data.slice(1).forEach(row => {
                const tr = document.createElement('tr');
                for(let i=0; i<currentReportMaxCols; i++) { const td = document.createElement('td'); td.textContent = row[i] || ''; tr.appendChild(td); }
                b.appendChild(tr);
            });

            // التمرير التلقائي لأسفل الجدول لرؤية أحدث البيانات (الصف الأخير)
            setTimeout(() => {
                const mainContent = document.getElementById('mainScrollContent');
                if (mainContent) {
                    mainContent.scrollTo({ top: mainContent.scrollHeight, behavior: 'smooth' });
                }
            }, 100);
        }

        function filterReportTable() {
            const q = document.getElementById('report-search-input').value.toLowerCase();
            if(!q) return renderReportTable(rawReportData);
            const filtered = [rawReportData[0], ...rawReportData.slice(1).filter(r => r.some(c => String(c).toLowerCase().includes(q)))];
            renderReportTable(filtered);
            
            // التأكد من النزول للأسفل أيضاً بعد التصفية إذا كانت النتائج كثيرة
            setTimeout(() => {
                const mainContent = document.getElementById('mainScrollContent');
                if (mainContent) mainContent.scrollTo({ top: mainContent.scrollHeight, behavior: 'smooth' });
            }, 50);
        }
    </script>
</body>
</html>
