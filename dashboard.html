<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CETC Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #C41230; --sidebar: #0a0a0a; --bg: #f4f4f4; --surface: #ffffff; --text: #111111; --text-light: #555555; }
        body { font-family: 'Cairo', sans-serif; margin: 0; background: var(--bg); color: var(--text); overflow: hidden; }
        
        .app-layout { display: flex; height: 100vh; overflow: hidden; }
        
        /* Sidebar */
        .sidebar { width: 280px; background: var(--sidebar); display: flex; flex-direction: column; transition: 0.3s; z-index: 100; box-shadow: 4px 0 15px rgba(0,0,0,0.15); }
        .sidebar-header { padding: 25px; text-align: center; border-bottom: 1px solid #222; background: #000; }
        .logo-box { background: #ffffff; padding: 12px 15px; border-radius: 12px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        .logo-box img { max-height: 45px; display: block; }
        .menu-list { flex-grow: 1; padding: 20px 0; overflow-y: auto; }
        .menu-item { padding: 15px 25px; display: flex; align-items: center; gap: 15px; color: #a0a0a0; font-weight: 700; cursor: pointer; transition: 0.3s; margin: 5px 15px; border-radius: 8px; }
        .menu-item:hover, .menu-item.active { background: var(--primary); color: white; }
        .user-section { padding: 20px; background: #000; text-align: center; border-top: 1px solid #222; }
        .logout-btn { color: #ff4444; text-decoration: none; font-size: 0.95rem; font-weight: 800; display: block; margin-top: 10px; }

        /* Main Content */
        .main-content { flex: 1; overflow-y: auto; padding: 30px; background: var(--bg); }
        .module { display: none; animation: fadeIn 0.4s ease; }
        .module.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Tabs */
        .tab-group { display: flex; gap: 12px; margin-bottom: 25px; }
        .tab-btn { padding: 10px 20px; border: 2px solid #ddd; background: var(--surface); color: var(--text-light); font-weight: 800; border-radius: 8px; cursor: pointer; transition: 0.3s; font-family: inherit; font-size: 0.95rem; }
        .tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); box-shadow: 0 4px 10px rgba(196,18,48,0.2); }

        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 25px; display: none; }
        .stat-card { background: var(--surface); padding: 25px; border-radius: 12px; border-right: 6px solid var(--primary); box-shadow: 0 4px 10px rgba(0,0,0,0.08); text-align: center; }
        .stat-card h3 { margin: 0; font-size: 1.1rem; color: var(--text-light); font-weight: 800; }
        .stat-val { font-weight: 900; font-size: 1.6rem; margin-top: 8px; color: #000 !important; } /* الأرقام دائماً سوداء */

        /* Modern Table */
        .table-wrapper { background: var(--surface); border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.08); overflow-x: auto; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; white-space: nowrap; }
        th { background: #111; color: #fff; padding: 18px 15px; font-size: 0.95rem; font-weight: 800; border-bottom: 3px solid var(--primary); position: sticky; top: 0; z-index: 10; text-align: center; }
        td { padding: 15px; border-bottom: 1px solid #ddd; text-align: center; font-size: 0.95rem; font-weight: 700; color: #000; }
        tr:nth-child(odd) td { background-color: #ffffff; }
        tr:nth-child(even) td { background-color: #f8f9fa; }
        tr:hover td { background-color: #e2e8f0; cursor: pointer; }
        .loading { padding: 50px !important; color: var(--primary); font-weight: 900; font-size: 1.2rem; background: #fff !important; }

        .val-positive { color: #10b981 !important; font-weight: 900; }
        .val-negative { color: #ef4444 !important; font-weight: 900; }

        /* الموبايل */
        @media (max-width: 768px) {
            .app-layout { flex-direction: column; overflow-y: auto; }
            .sidebar { width: 100%; height: auto; padding: 10px; box-sizing: border-box; }
            .sidebar-header { padding: 10px 15px; background: #000; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; }
            .logo-box { padding: 6px 10px; margin: 0; border-radius: 8px; }
            .logo-box img { max-height: 30px; }
            .menu-list { padding: 10px 0; display: flex; flex-direction: row; overflow-x: auto; }
            .menu-list::-webkit-scrollbar { display: none; }
            .menu-item { flex-shrink: 0; padding: 8px 15px; margin: 0 5px; font-size: 0.85rem; }
            .user-section { display: none; }
            .main-content { padding: 15px; overflow-y: visible; }
            .tab-group { overflow-x: auto; padding-bottom: 10px; }
            .tab-group::-webkit-scrollbar { display: none; }
            .tab-btn { flex-shrink: 0; }
            .stats-grid { grid-template-columns: 1fr; gap: 15px; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-box">
                    <img src="https://ejust.edu.eg/assets/img/logo.png" alt="E-JUST Logo">
                </div>
                <div style="font-weight: 900; color: white; font-size: 1.1rem; margin-top:10px;">CETC DASHBOARD</div>
            </div>
            <nav class="menu-list">
                <div class="menu-item active" onclick="switchMod('billing', this)"><i class="fas fa-file-invoice-dollar"></i><span>حصر الفواتير</span></div>
                <div class="menu-item" onclick="switchMod('monthly', this)"><i class="fas fa-calendar-alt"></i><span>الايرادات الشهرية</span></div>
                <div class="menu-item" onclick="switchMod('reports', this)"><i class="fas fa-list-ol"></i><span>مسلسلات التقارير</span></div>
                <div class="menu-item" onclick="switchMod('revenue', this)"><i class="fas fa-chart-line"></i><span>متابعة الايرادات</span></div>
                <a href="/logout" class="menu-item" style="color: #ff4444;"><i class="fas fa-sign-out-alt"></i><span>خروج</span></a>
            </nav>
            <div class="user-section">
                <i class="fas fa-user-shield" style="font-size: 2.5rem; color: #444; margin-bottom: 10px;"></i>
                <div style="color: white; font-weight: 800;">مسؤول النظام</div>
                <a href="/logout" class="logout-btn">تسجيل الخروج</a>
            </div>
        </aside>

        <main class="main-content">
            <section id="billing-module" class="module active">
                <h2 style="color:var(--sidebar); border-bottom: 4px solid var(--primary); padding-bottom:10px; display:inline-block; font-weight: 900;">حصر فواتير الشركات</h2>
                
                <div class="tab-group">
                    <button class="tab-btn" onclick="loadData(1, this)"><i class="fas fa-folder-open"></i> سجل - 01 LOG</button>
                    <button class="tab-btn" onclick="loadData(3, this)"><i class="fas fa-building"></i> الحي التاسع</button>
                    <button class="tab-btn" onclick="loadData(2, this)"><i class="fas fa-water"></i> ترعة الحمام</button>
                    <button class="tab-btn" onclick="loadData(4, this)"><i class="fas fa-home"></i> مشروع ديارنا</button>
                </div>
                
                <!-- تم ترتيب الصناديق من اليمين لليسار حسب الصورة -->
                <div class="stats-grid" id="stat-billing">
                    <div class="stat-card">
                        <h3>صافي المديونية</h3>
                        <div id="d-rec" class="stat-val">0</div>
                    </div>
                    
                    <div class="stat-card">
                        <h3>المبلغ المستق</h3>
                        <div id="d-bal" class="stat-val">0</div>
                    </div>
                    
                    <div class="stat-card">
                        <h3>اجمالي التوريد</h3>
                        <div id="d-due" class="stat-val">0</div>
                    </div>
                </div>

                <div class="table-wrapper">
                    <table>
                        <thead><tr id="h-billing"></tr></thead>
                        <tbody id="b-billing"><tr><td colspan="10" style="padding:40px;">اختر المشروع للبدء...</td></tr></tbody>
                    </table>
                </div>
            </section>

            <section id="monthly-module" class="module">
                <h2 style="color:var(--sidebar); border-bottom: 4px solid var(--primary); padding-bottom:10px; display:inline-block; font-weight: 900;">الايرادات الشهرية</h2>
                <div class="tab-group"><button class="tab-btn active" onclick="loadData(5, this)"><i class="fas fa-chart-pie"></i> كافة الايرادات</button></div>
                <div class="table-wrapper">
                    <table><thead><tr id="h-monthly"></tr></thead><tbody id="b-monthly"></tbody></table>
                </div>
            </section>
        </main>
    </div>

    <script>
        function switchMod(name, btn) {
            document.querySelectorAll('.menu-item').forEach(i => i.classList.remove('active'));
            if(btn && !btn.hasAttribute('href')) btn.classList.add('active');
            document.querySelectorAll('.module').forEach(s => s.classList.remove('active'));
            document.getElementById(name + '-module').classList.add('active');
        }

        // دالة تنسيق الأرقام بكسر عشري واحد كحد أقصى للكسور
        function formatNumber(val) {
            if (val === undefined || val === null || isNaN(parseFloat(val))) return '-';
            const num = parseFloat(val);
            if (num % 1 !== 0) {
                return num.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
            }
            return num.toLocaleString('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 0 });
        }

        async function loadData(id, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            const mod = document.querySelector('.module.active').id.split('-')[0];
            const h = document.getElementById('h-'+mod), b = document.getElementById('b-'+mod);
            
            try {
                b.innerHTML = '<tr><td colspan="10" class="loading"><i class="fas fa-circle-notch fa-spin"></i> جاري مزامنة البيانات...</td></tr>';
                const res = await fetch(`/get-data/${id}`);
                const data = await res.json();
                
                h.innerHTML = ''; b.innerHTML = '';
                
                if(data.length > 2) {
                    const headers = data[2];
                    
                    headers.forEach(t => { 
                        const th = document.createElement('th'); 
                        th.textContent = t || '-'; 
                        h.appendChild(th); 
                    });

                    const amountColumns = [];
                    headers.forEach((t, idx) => {
                        if (t && (t.includes('مبلغ') || t.includes('فاتورة') || t.includes('مستحق') || t.includes('مورد') || t.includes('رصيد'))) {
                            amountColumns.push(idx);
                        }
                    });

                    let due = 0, rec = 0;
                    const dueColIndex = (id == 1 || id == 5) ? 4 : 3;
                    const recColIndex = (id == 1 || id == 5) ? 5 : 4;

                    data.slice(3).forEach(row => {
                        if(!row[0]) return;
                        const tr = document.createElement('tr');
                        
                        row.forEach((c, idx) => {
                            const td = document.createElement('td'); 
                            
                            if (amountColumns.includes(idx) && c !== undefined && c !== null) {
                                const val = parseFloat(c);
                                if (!isNaN(val)) {
                                    td.textContent = formatNumber(val);
                                    
                                    const headerText = headers[idx] || '';
                                    // عمود المبلغ المستحق: يبقى أسود دائماً حتى لو كان موجباً. السالب فقط يكون أحمر.
                                    if (headerText.includes('المستحق') || headerText.includes('مستحق')) {
                                        if (val < 0) td.classList.add('val-negative');
                                    } else {
                                        // باقي الأعمدة تظهر خضراء للموجب وحمراء للسالب
                                        if (val > 0) td.classList.add('val-positive');
                                        else if (val < 0) td.classList.add('val-negative');
                                    }
                                } else {
                                    td.textContent = c || '-';
                                }
                            } else {
                                td.textContent = c || '-';
                            }

                            tr.appendChild(td);
                            
                            // الحساب الإجمالي
                            if(idx === dueColIndex) due += parseFloat(c) || 0;
                            if(idx === recColIndex) rec += parseFloat(c) || 0;
                        });
                        b.appendChild(tr);
                    });
                    
                    if(mod === 'billing') {
                        document.getElementById('stat-billing').style.display = 'grid';
                        
                        // 1. المديوينة
                        document.getElementById('d-rec').textContent = formatNumber(rec) + ' ج.م';
                        
                        // 2. المستحق
                        document.getElementById('d-bal').textContent = formatNumber(due - rec) + ' ج.م';
                        
                        // 3. التوريد
                        document.getElementById('d-due').textContent = formatNumber(due) + ' ج.م';
                    }
                } else {
                    b.innerHTML = '<tr><td colspan="10" style="padding: 30px; font-weight: bold;">لا توجد بيانات مسجلة.</td></tr>';
                }
            } catch (err) { 
                b.innerHTML = '<tr><td colspan="10" style="color:red; padding: 30px; font-weight: bold;">خطأ في جلب البيانات من الخادم!</td></tr>'; 
            }
        }
    </script>
</body>
</html>
