<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CETC Unit - Dashboard</title>
    <!-- خط القاهرة الاحترافي من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ejust-red: #C41230;
            --main-black: #1a1a1a;
            --bg-light: #f8f9fa;
            --white: #ffffff;
            --text-gray: #555;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-light);
            margin: 0;
            padding: 0;
            color: var(--main-black);
        }

        /* رأس الصفحة المطور */
        header {
            background-color: var(--white);
            border-bottom: 5px solid var(--ejust-red);
            padding: 30px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .logo-box {
            background: #f4f4f4; /* خلفية رمادية فاتحة لإبراز اللوجو إذا كان أبيض */
            display: inline-block;
            padding: 15px 25px;
            border-radius: 12px;
            margin-bottom: 15px;
        }

        .logo-box img {
            max-height: 80px;
            display: block;
        }

        header h1 {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--main-black);
        }

        header p.unit-name {
            margin: 5px 0;
            font-size: 1.1rem;
            color: var(--ejust-red);
            font-weight: 700;
        }

        header p.uni-name {
            margin: 0;
            font-size: 0.9rem;
            color: var(--text-gray);
        }

        /* زر تسجيل الخروج */
        .logout-link {
            position: absolute;
            top: 25px;
            left: 25px;
            color: var(--text-gray);
            text-decoration: none;
            font-size: 0.85rem;
            border: 1.5px solid #ddd;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: 600;
            transition: 0.3s;
        }
        .logout-link:hover {
            background: var(--ejust-red);
            color: var(--white);
            border-color: var(--ejust-red);
        }

        .container {
            max-width: 1250px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* أزرار المشاريع (التبويبات) */
        .project-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 35px;
        }

        .tab-btn {
            padding: 14px 28px;
            border: 2px solid var(--main-black);
            background: var(--white);
            color: var(--main-black);
            border-radius: 10px;
            cursor: pointer;
            font-weight: 700;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .tab-btn:hover, .tab-btn.active {
            background: var(--ejust-red);
            color: var(--white);
            border-color: var(--ejust-red);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(196, 18, 48, 0.2);
        }

        /* لوحة الإحصائيات (المربعات الملونة) */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 25px;
            margin-bottom: 35px;
            display: none; /* تظهر فقط عند تحميل البيانات */
        }

        .stat-card {
            background: var(--white);
            padding: 30px 20px;
            border-radius: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-right: 8px solid #ddd;
        }

        .stat-card.due { border-right-color: var(--main-black); }
        .stat-card.received { border-right-color: var(--ejust-red); }
        .stat-card.balance { border-right-color: #27ae60; }

        .stat-card h3 { margin: 0; font-size: 1rem; color: var(--text-gray); }
        .stat-card .amount { font-size: 2rem; font-weight: 800; margin-top: 12px; color: var(--main-black); }

        /* صندوق البحث الذكي */
        .search-section {
            margin-bottom: 25px;
            display: none;
        }

        #searchInput {
            width: 100%;
            padding: 18px 25px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 1.1rem;
            font-family: 'Cairo', sans-serif;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        #searchInput:focus {
            border-color: var(--ejust-red);
            box-shadow: 0 0 15px rgba(196, 18, 48, 0.1);
        }

        /* الجدول المنسق */
        .table-overflow {
            background: var(--white);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 1000px;
        }

        th {
            background-color: var(--main-black);
            color: var(--white);
            padding: 22px 15px;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
        }

        td {
            padding: 18px 15px;
            border-bottom: 1px solid #f2f2f2;
            text-align: center;
            font-size: 1rem;
            font-weight: 500;
        }

        tr:nth-child(even) { background-color: #fcfcfc; }
        tr:hover { background-color: #f8f8f8; cursor: default; }

        /* رسالة التحميل */
        #loadingOverlay {
            display: none;
            text-align: center;
            padding: 40px;
            color: var(--ejust-red);
            font-weight: 800;
            font-size: 1.2rem;
        }

        /* تجاوب الموبايل */
        @media (max-width: 768px) {
            header { padding: 50px 15px 30px; }
            .tab-btn { width: 100%; }
            .logout-link { top: 10px; left: 10px; width: 80px; text-align: center; }
        }
    </style>
</head>
<body>

    <header>
        <a href="/logout" class="logout-link">خروج</a>
        <div class="logo-box">
            <!-- رابط شعار الجامعة الرسمي -->
            <img src="https://ejust.edu.eg/assets/img/logo.png" alt="E-JUST Logo">
        </div>
        <h1>CETC Unit</h1>
        <p class="unit-name">Civil Engineering Testing and Consulting Unit</p>
        <p class="uni-name">Egypt-Japan University for Science and Technology</p>
    </header>

    <div class="container">
        <!-- أزرار التبديل بين الملفات -->
        <div class="project-tabs">
            <button class="tab-btn" onclick="fetchProject(1, this)">سجل - 01 LOG</button>
            <button class="tab-btn" onclick="fetchProject(2, this)">إسكان الحي التاسع</button>
            <button class="tab-btn" onclick="fetchProject(3, this)">ترعة الحمام</button>
            <button class="tab-btn" onclick="fetchProject(4, this)">مشروع ديارنا</button>
        </div>

        <!-- الإحصائيات -->
        <div class="stats-grid" id="statsArea">
            <div class="stat-card due">
                <h3>إجمالي المستحق</h3>
                <div class="amount" id="totalDueText">0</div>
            </div>
            <div class="stat-card received">
                <h3>إجمالي المورد</h3>
                <div class="amount" id="totalReceivedText">0</div>
            </div>
            <div class="stat-card balance">
                <h3>صافي المديونية</h3>
                <div class="amount" id="netBalanceText">0</div>
            </div>
        </div>

        <!-- البحث -->
        <div class="search-section" id="searchArea">
            <input type="text" id="searchInput" placeholder="ابحث باسم الشركة أو تفاصيل البيان..." onkeyup="filterRows()">
        </div>

        <!-- التحميل -->
        <div id="loadingOverlay">جاري جلب البيانات من Google Drive...</div>

        <!-- الجدول -->
        <div class="table-overflow">
            <table id="mainTable">
                <thead><tr id="headerRow"></tr></thead>
                <tbody id="dataRows">
                    <tr><td colspan="6" style="padding: 80px; color: #aaa; font-size: 1.2rem;">يرجى اختيار ملف المشروع أعلاه لعرض البيانات</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentData = [];

        async function fetchProject(id, btn) {
            // تحديث حالة الأزرار
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            // إعداد الواجهة
            document.getElementById('loadingOverlay').style.display = 'block';
            document.getElementById('statsArea').style.display = 'none';
            document.getElementById('searchArea').style.display = 'none';

            try {
                const response = await fetch(`/get-data/${id}`);
                const result = await response.json();
                
                if(result.error) {
                    alert("خطأ: " + result.error);
                } else {
                    currentData = result;
                    populateTable(currentData);
                }
            } catch (err) {
                alert("تعذر الاتصال بالسيرفر، يرجى المحاولة لاحقاً");
            } finally {
                document.getElementById('loadingOverlay').style.display = 'none';
            }
        }

        function populateTable(data) {
            const hRow = document.getElementById('headerRow');
            const bRows = document.getElementById('dataRows');
            hRow.innerHTML = '';
            bRows.innerHTML = '';

            if (data.length > 0) {
                // العناوين: نفترض أنها في الصف رقم 3 (إندكس 2)
                const headers = data[2] || [];
                headers.forEach(text => {
                    const th = document.createElement('th');
                    th.textContent = text || '-';
                    hRow.appendChild(th);
                });

                // البيانات والإحصائيات
                let sumDue = 0, sumRec = 0;

                data.slice(3).forEach(row => {
                    if(!row[0] && !row[1]) return; // تجاهل الصفوف الفارغة تماماً
                    
                    const tr = document.createElement('tr');
                    row.forEach((cell, idx) => {
                        const td = document.createElement('td');
                        const val = cell || '';
                        // تنسيق الأرقام بفاصلة الآلاف
                        td.textContent = (isNaN(val) || val === '') ? val : Number(val).toLocaleString('en-US');
                        tr.appendChild(td);
                    });
                    bRows.appendChild(tr);

                    // حسابات (Index 2 = D المستحق، Index 3 = E المورد)
                    sumDue += Number(row[2]) || 0;
                    sumRec += Number(row[3]) || 0;
                });

                // تحديث كروت الإحصائيات
                document.getElementById('totalDueText').textContent = sumDue.toLocaleString() + " ج.م";
                document.getElementById('totalReceivedText').textContent = sumRec.toLocaleString() + " ج.م";
                document.getElementById('netBalanceText').textContent = (sumDue - sumRec).toLocaleString() + " ج.م";

                document.getElementById('statsArea').style.display = 'grid';
                document.getElementById('searchArea').style.display = 'block';
            }
        }

        function filterRows() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const trs = document.getElementById('dataRows').getElementsByTagName('tr');
            for (let tr of trs) {
                tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none";
            }
        }
    </script>
</body>
</html>
