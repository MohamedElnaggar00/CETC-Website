<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CETC Unit - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --ejust-red: #C41230;
            --main-black: #1a1a1a;
            --bg-light: #f8f9fa;
            --white: #ffffff;
            --positive-green: #27ae60;
            --negative-red: #e74c3c;
        }

        body { font-family: 'Cairo', sans-serif; background-color: var(--bg-light); margin: 0; padding: 0; }

        header { background: var(--white); border-bottom: 5px solid var(--ejust-red); padding: 25px; text-align: center; position: relative; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .logo-box { background: #f4f4f4; display: inline-block; padding: 10px 20px; border-radius: 10px; margin-bottom: 10px; }
        .logo-box img { max-height: 70px; }
        
        .logout-link { position: absolute; top: 20px; left: 20px; color: #666; text-decoration: none; border: 1px solid #ddd; padding: 5px 12px; border-radius: 5px; font-size: 0.8rem; }

        .container { max-width: 1200px; margin: 25px auto; padding: 0 20px; }

        .project-tabs { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 30px; }
        .tab-btn { padding: 12px 20px; border: 2px solid var(--main-black); background: var(--white); cursor: pointer; font-weight: 700; border-radius: 8px; transition: 0.3s; }
        .tab-btn.active { background: var(--ejust-red); color: var(--white); border-color: var(--ejust-red); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 30px; display: none; }
        .stat-card { background: var(--white); padding: 20px; border-radius: 12px; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border-right: 6px solid #ddd; }
        .stat-card.balance { border-right-color: var(--ejust-red); }
        .stat-card .amount { font-size: 1.6rem; font-weight: 800; margin-top: 5px; }

        .search-section { margin-bottom: 20px; display: none; }
        #searchInput { width: 100%; padding: 15px; border: 2px solid #ddd; border-radius: 10px; outline: none; font-family: inherit; }

        .table-wrapper { background: var(--white); border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; min-width: 900px; }
        th { background: var(--main-black); color: var(--white); padding: 15px; font-size: 0.9rem; }
        td { padding: 14px; border-bottom: 1px solid #eee; text-align: center; font-size: 0.95rem; }

        /* تباين الصفوف */
        tr:nth-child(even) { background-color: #f9f9f9; }
        tr:hover { background-color: #f1f1f1; }

        /* تلوين مبلغ الفاتورة فقط */
        .invoice-pos { color: var(--positive-green) !important; font-weight: 800; }
        .invoice-neg { color: var(--negative-red) !important; font-weight: 800; }

        #loading { display: none; text-align: center; color: var(--ejust-red); font-weight: 800; padding: 20px; }
    </style>
</head>
<body>

    <header>
        <a href="/logout" class="logout-link">خروج</a>
        <div class="logo-box">
            <img src="https://ejust.edu.eg/assets/img/logo.png" alt="E-JUST Logo">
        </div>
        <h2 style="margin:0; font-size: 1.4rem;">CETC Unit</h2>
        <p style="margin:0; color:var(--ejust-red); font-weight:700; font-size:0.9rem;">Civil Engineering Testing and Consulting Unit</p>
    </header>

    <div class="container">
        <div class="project-tabs">
            <button class="tab-btn" onclick="loadData(1, this)">سجل - 01 LOG</button>
            <button class="tab-btn" onclick="loadData(2, this)">إسكان الحي التاسع</button>
            <button class="tab-btn" onclick="loadData(3, this)">ترعة الحمام</button>
            <button class="tab-btn" onclick="loadData(4, this)">مشروع ديارنا</button>
        </div>

        <div class="stats-grid" id="statsArea">
            <div class="stat-card"><h3>إجمالي المستحق</h3><div class="amount" id="sumDue">0</div></div>
            <div class="stat-card"><h3>إجمالي المورد</h3><div class="amount" id="sumRec">0</div></div>
            <div class="stat-card balance"><h3>صافي المديونية</h3><div class="amount" id="sumBal">0</div></div>
        </div>

        <div class="search-section" id="searchArea">
            <input type="text" id="searchInput" placeholder="ابحث باسم الشركة أو البيان..." onkeyup="search()">
        </div>

        <div id="loading">جاري التحديث من Google Drive...</div>

        <div class="table-wrapper">
            <table id="mainTable">
                <thead><tr id="hRow"></tr></thead>
                <tbody id="bRows">
                    <tr><td colspan="6" style="padding:50px; color:#999;">يرجى اختيار المشروع لعرض البيانات</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        let currentId = null;

        async function loadData(id, btn) {
            currentId = id;
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('loading').style.display = 'block';
            
            try {
                const res = await fetch(`/get-data/${id}`);
                const data = await res.json();
                render(data);
            } catch (e) { alert("خطأ في الاتصال"); }
            finally { document.getElementById('loading').style.display = 'none'; }
        }

        function render(data) {
            const h = document.getElementById('hRow');
            const b = document.getElementById('bRows');
            h.innerHTML = ''; b.innerHTML = '';

            if (data.length > 0) {
                data[2].forEach(txt => {
                    const th = document.createElement('th');
                    th.textContent = txt || '-';
                    h.appendChild(th);
                });

                let due = 0, rec = 0;
                // تحديد موقع عمود مبلغ الفاتورة (آخر عمود دائماً في المصفوفة المرسلة)
                const invoiceColIdx = (currentId == 1) ? 5 : 4;

                data.slice(3).forEach(row => {
                    if(!row[0] && !row[1]) return;
                    const tr = document.createElement('tr');
                    
                    row.forEach((cell, idx) => {
                        const td = document.createElement('td');
                        const val = Number(cell);

                        // تلوين عمود مبلغ الفاتورة فقط
                        if (idx === invoiceColIdx && !isNaN(val) && cell !== '') {
                            td.textContent = val.toLocaleString();
                            td.className = val < 0 ? 'invoice-neg' : 'invoice-pos';
                        } else {
                            td.textContent = isNaN(val) || cell === '' ? cell : val.toLocaleString();
                        }
                        tr.appendChild(td);
                    });
                    b.appendChild(tr);
                    due += Number(row[2]) || 0;
                    rec += Number(row[3]) || 0;
                });

                document.getElementById('sumDue').textContent = due.toLocaleString() + " ج.م";
                document.getElementById('sumRec').textContent = rec.toLocaleString() + " ج.م";
                document.getElementById('sumBal').textContent = (due - rec).toLocaleString() + " ج.م";
                document.getElementById('statsArea').style.display = 'grid';
                document.getElementById('searchArea').style.display = 'block';
            }
        }

        function search() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            const trs = document.getElementById('bRows').getElementsByTagName('tr');
            for (let tr of trs) tr.style.display = tr.textContent.toLowerCase().includes(q) ? "" : "none";
        }
    </script>
</body>
</html>
