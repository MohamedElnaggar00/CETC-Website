<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - CETC</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --red: #C41230; --black: #0f172a; --gray: #f1f5f9; }
        body { font-family: 'Cairo', sans-serif; margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(rgba(15,23,42,0.8), rgba(15,23,42,0.8)), url('https://ejust.edu.eg/storage/EventsPhoto/top-min%20(1).jpg') center/cover; }
        
        .login-box { background: rgba(255, 255, 255, 0.98); width: 90%; max-width: 400px; padding: 40px 30px; border-radius: 20px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5); text-align: center; border-top: 6px solid var(--red); box-sizing: border-box; backdrop-filter: blur(10px); }
        .logo-box img { max-height: 60px; margin-bottom: 20px; }
        h2 { margin: 0 0 5px; color: var(--black); font-weight: 800; }
        p.subtitle { color: #64748b; font-size: 0.9rem; margin-bottom: 30px; }

        .input-group { margin-bottom: 20px; text-align: right; position: relative; }
        .input-group label { display: block; margin-bottom: 8px; font-weight: 700; color: #334155; font-size: 0.9rem; }
        .input-group i { position: absolute; right: 15px; top: 40px; color: #94a3b8; }
        .input-group input { width: 100%; padding: 12px 40px 12px 15px; border: 2px solid #e2e8f0; border-radius: 12px; font-family: inherit; font-size: 16px; outline: none; transition: 0.3s; box-sizing: border-box; background: var(--gray); }
        .input-group input:focus { border-color: var(--red); background: #fff; box-shadow: 0 0 0 4px rgba(196,18,48,0.1); }

        button { width: 100%; padding: 14px; background: var(--red); color: white; border: none; border-radius: 12px; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px -1px rgba(196,18,48,0.3); display: flex; align-items: center; justify-content: center; gap: 10px; }
        button:hover { background: #a00e26; transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(196,18,48,0.4); }
        button:disabled { background: #888888; cursor: not-allowed; transform: none; box-shadow: none; }

        .back { display: block; margin-top: 25px; color: #64748b; text-decoration: none; font-size: 0.9rem; transition: 0.3s; }
        .back:hover { color: var(--red); }

        /* ستايل النافذة المنبثقة للخطأ (Popup) */
        .popup-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .popup-box { background: white; padding: 30px; border-radius: 16px; text-align: center; max-width: 350px; width: 90%; border-top: 6px solid var(--red); box-shadow: 0 20px 25px -5px rgba(0,0,0,0.3); animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); box-sizing: border-box; }
        .popup-box i { font-size: 3rem; color: var(--red); margin-bottom: 15px; }
        .popup-box h3 { margin: 0 0 10px; font-weight: 800; color: var(--black); }
        .popup-box p { color: #64748b; font-size: 0.95rem; line-height: 1.5; margin: 0 0 20px; font-weight: 600; }
        .popup-box button { width: auto; padding: 10px 30px; margin: 0 auto; display: block; background: var(--red); color: white; border: none; border-radius: 8px; font-family: inherit; font-size: 1rem; font-weight: bold; cursor: pointer; }

        @keyframes popIn { 
            from { transform: scale(0.8); opacity: 0; } 
            to { transform: scale(1); opacity: 1; } 
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo-box"><img src="https://ejust.edu.eg/assets/img/logo.png" alt="Logo"></div>
        <h2>لوحة إدارة CETC</h2>
        <p class="subtitle">يُرجى إدخال بيانات الاعتماد للوصول للنظام</p>
        <form id="loginForm">
            <div class="input-group">
                <label>اسم المستخدم</label>
                <i class="fas fa-user"></i>
                <input type="text" name="username" required autocomplete="off">
            </div>
            <div class="input-group">
                <label>كلمة المرور</label>
                <i class="fas fa-lock"></i>
                <input type="password" name="password" required>
            </div>
            <button type="submit" id="submitBtn">تسجيل الدخول</button>
        </form>
        <a href="/" class="back"><i class="fas fa-arrow-right"></i> العودة للرئيسية</a>
    </div>

    <!-- النافذة المنبثقة للخطأ (Popup Modal) -->
    <div class="popup-overlay" id="errorPopup">
        <div class="popup-box">
            <i class="fas fa-exclamation-triangle"></i>
            <h3>خطأ في الدخول</h3>
            <p id="errorMsg">بيانات الدخول غير صحيحة.</p>
            <button onclick="closePopup()">حسناً</button>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault(); 
            
            const username = this.username.value;
            const password = this.password.value;
            const btn = document.getElementById('submitBtn');
            
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> جاري التحقق...';

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();

                if (data.success) {
                    window.location.href = data.redirect;
                } else {
                    showPopup(data.error);
                }
            } catch (err) {
                showPopup('فشل الاتصال بالخادم. يرجى التحقق من اتصال الشبكة.');
            } finally {
                btn.disabled = false;
                btn.innerHTML = originalText;
            }
        });

        function showPopup(msg) {
            document.getElementById('errorMsg').textContent = msg;
            document.getElementById('errorPopup').style.display = 'flex';
        }

        function closePopup() {
            document.getElementById('errorPopup').style.display = 'none';
        }
    </script>
</body>
</html>
